<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de Veículo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container container-estreito">
    <h1 th:text="${veiculo.id == null} ? 'Novo veículo' : 'Editar veículo'">Veículo</h1>

    <form th:action="@{/veiculos/salvar}" th:object="${veiculo}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" th:field="*{modelo}" placeholder="Ex.: Gol 1.0"
                   th:classappend="${#fields.hasErrors('modelo')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></span>
        </div>

        <div class="campo">
            <label for="placa">Placa</label>
            <input type="text" id="placa" th:field="*{placa}" placeholder="ABC-1234 ou ABC1D23" maxlength="8"
                   th:classappend="${#fields.hasErrors('placa')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></span>
        </div>

        <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano" th:field="*{ano}" placeholder="Ex.: 2020"
                   th:classappend="${#fields.hasErrors('ano')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></span>
        </div>

        <div class="botoes">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a class="btn btn-claro" th:href="@{/veiculos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
