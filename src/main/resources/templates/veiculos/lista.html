<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container">
    <header class="topo">
        <h1>Cadastro de Veículos</h1>
        <a class="btn btn-primario" th:href="@{/veiculos/novo}">+ Novo veículo</a>
    </header>

    <p class="alerta-sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>

    <form class="busca" th:action="@{/veiculos}" method="get">
        <input type="text" name="busca" th:value="${busca}" placeholder="Buscar por modelo...">
        <button type="submit" class="btn">Buscar</button>
        <a th:if="${busca != null and !busca.isBlank()}" th:href="@{/veiculos}" class="btn btn-claro">Limpar</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Ano</th>
            <th class="acoes">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${veiculos}">
            <td th:text="${v.id}"></td>
            <td th:text="${v.modelo}"></td>
            <td th:text="${v.placa}"></td>
            <td th:text="${v.ano}"></td>
            <td class="acoes">
                <a class="btn btn-claro" th:href="@{/veiculos/editar/{id}(id=${v.id})}">Editar</a>
                <form class="inline" th:action="@{/veiculos/excluir/{id}(id=${v.id})}" method="post"
                      onsubmit="return confirm('Deseja realmente excluir este veículo?');">
                    <button type="submit" class="btn btn-perigo">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(veiculos)}">
            <td colspan="5" class="vazio">Nenhum veículo encontrado.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
