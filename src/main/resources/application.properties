spring.application.name=veiculos

# Banco de dados (MySQL do XAMPP) - crie o banco db_veiculos no phpMyAdmin antes de subir a aplicacao
spring.datasource.url=jdbc:mysql://localhost:3306/db_veiculos?useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
