spring.application.name=veiculos

# Banco de dados (MySQL do XAMPP)
# Crie o banco db_veiculos no phpMyAdmin antes de subir a aplicacao.
# Usuario e senha vem de VARIAVEIS DE AMBIENTE (nada de senha no codigo):
#   DB_USER      (padrao: root)
#   DB_PASSWORD  (padrao: vazio, igual ao XAMPP recem instalado)
spring.datasource.url=jdbc:mysql://localhost:3306/db_veiculos?useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
